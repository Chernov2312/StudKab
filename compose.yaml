name: puls

x-backend: &backend
  image: puls-api:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: "postgresql+asyncpg://puls:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/puls"
    APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8080}"
    APP_ENV: "${APP_ENV:-development}"

x-celery-env: &celery-env
  CELERY_BROKER_URL: "redis://redis:6379/0"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puls
      POSTGRES_DB: puls
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      TZ: UTC
    networks: [data]
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U puls -d puls"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *backend
    networks: [data]
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    networks: [data, proxy]
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: puls-web:local
    networks: [proxy]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CADDY_ADDRESS: ":8080"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["async"]
    networks: [broker]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    profiles: ["async"]
    networks: [data, broker]
    environment:
      <<: [*backend-env, *celery-env]
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect --timeout 3 --destination celery@$$HOSTNAME ping"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *backend
    profiles: ["async"]
    networks: [broker]
    environment: *celery-env
    command:
      ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO",
       "--schedule=/tmp/puls-celerybeat", "--pidfile=/tmp/puls-celerybeat.pid"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, pathlib; os.kill(int(pathlib.Path('/tmp/puls-celerybeat.pid').read_text()), 0)"]
      interval: 20s
      timeout: 3s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    <<: *backend
    networks: [data]
    profiles: ["tools"]
    command: ["python", "-m", "app.seed"]
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
      DEMO_ALINA_PASSWORD: "${DEMO_ALINA_PASSWORD:-}"
      DEMO_MARK_PASSWORD: "${DEMO_MARK_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database:

networks:
  data:
    internal: true
  broker:
    internal: true
  proxy:
