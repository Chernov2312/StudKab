[project]
name = "puls-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "fastapi>=0.116.1",
    "jsonschema==4.25.1",
    "pydantic-settings==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "sqlalchemy==2.0.43",
    "starlette>=1.3.1,<2",
    "tzdata==2025.2",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "psycopg2-binary==2.9.10",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7,<8",
    "ruff==0.12.10",
    "testcontainers[postgres]==4.12.0",
    "types-jsonschema==4.25.1.20250822",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: uses a migrated PostgreSQL database"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
