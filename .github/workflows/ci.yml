name: Compose and Playwright

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated test credentials
        run: |
          for key in POSTGRES_PASSWORD DEMO_ALINA_PASSWORD DEMO_MARK_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Validate Compose, build, migrate and seed
        run: |
          docker compose config --quiet
          PULS_DOMAIN=puls.example.test docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose up --build -d --wait
          docker compose run --rm seed
          curl --fail --silent http://localhost:8080/api/v1/health/ready
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser scenarios
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Stop test services
        if: always()
        run: docker compose down
